services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: jobiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobiq
      POSTGRES_USER: jobiq
      POSTGRES_PASSWORD: jobiq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: